<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Artist.Name}}</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" />
    <style>
        .text-white {
            color: white;
        }
    </style>
</head>
<body>
    <div class="Group">
        <img src="{{.Artist.Image}}">
        <div>
            <h1 class="text-white">{{.Artist.Name}}</h1>
            <p class="text-white"><strong>Created:</strong> {{.Artist.CreationDate}}</p>
            <p class="text-white"><strong>First album released:</strong> {{.Artist.FirstAlbum}}</p>
            <p class="text-white"><strong>Members:</strong> {{range .Artist.Members}}{{.}}, {{end}}</p>
            <h2 class="text-white">Locations and Dates of Concerts</h2>
            {{range .Location.Locations}}
            {{.}}
            {{end}}
            <table>
                <thead>
                    <tr>
                        <th class="text-white">Location</th>
                        <th class="text-white">Date of concert</th>
                    </tr>
                </thead>
                <tbody>
    
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
