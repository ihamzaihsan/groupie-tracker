{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f2e9">
<meta name="color-scheme" content="light dark">
<script src="/assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
{{end}}
{{define "header"}}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header wrap">
    <a href="/" class="brand" aria-label="Concert Atlas home"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span>concert atlas<span class="brand-dot">.</span></a>
    <nav aria-label="Main navigation">
        <a href="/#collection" class="nav-link">The collection <span aria-hidden="true">&#8599;</span></a>
        <span class="header-note"><span class="status-dot"></span> A little closer to the music</span>
        <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode" hidden>
            <svg class="theme-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/>
            </svg>
            <svg class="theme-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
            </svg>
        </button>
    </nav>
</header>
{{end}}
{{define "footer"}}
<footer class="site-footer wrap"><a href="/" class="brand">concert atlas<span class="brand-dot">.</span></a><p>Good music. Great stories. All in one place.</p><span class="footer-note">Artist & concert archive <span aria-hidden="true">↗</span></span></footer>
{{end}}
